services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anonim-backend
    ports:
      - "8090:8090"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/anonim-web
      dockerfile: Dockerfile
    container_name: anonim-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped
